# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "github-action", "master", "test" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

permissions:
  contents: read

jobs:
  build-renderer:
    runs-on: windows-latest

    strategy:
      matrix:
        CONFIG: [Release, Debug]
        PLATFORM: [x86, x64]

    steps:
    - uses: actions/checkout@v6
      name: Checkout
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build Renderer
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild OpenGL.sln /m /p:Configuration=${{matrix.CONFIG}},Platform=${{matrix.PLATFORM}},BuildProjectReferences=false,Project=OpenGL  ${{env.SOLUTION_FILE_PATH}}

  test:
    runs-on: windows-latest
    strategy:
      matrix:
        CONFIG: [Release, Debug]
        PLATFORM: [x86, x64]

    steps:
    - name: Set Platform dir
      run: |
        if ("${{ matrix.PLATFORM }}" -eq "x64") {
          echo "PLATFORM_DIR=x64" >> $env:GITHUB_ENV
        } else {
          echo "PLATFORM_DIR=Win32" >> $env:GITHUB_ENV
        }

    - uses: actions/checkout@v6
      name: Checkout
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build Tests
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{matrix.CONFIG}},Platform=${{matrix.PLATFORM}},BuildProjectReferences=false,Project=renderer_test ${{env.SOLUTION_FILE_PATH}}

    - name: Install Mesa
      shell: cmd
      run: |
        curl.exe -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/25.3.5/mesa3d-25.3.5-release-msvc.7z
        mkdir mesa
        "C:\Program Files\7-Zip\7z.exe" x mesa.7z -r -omesa
        pushd mesa
        .\systemwidedeploy.cmd 1
        popd
        copy "test\dll\glew32.dll" "test\renderer_test\build\${{env.PLATFORM_DIR}}\${{matrix.CONFIG}}\"
        copy "test\dll\glu32.dll" "test\renderer_test\build\${{env.PLATFORM_DIR}}\${{matrix.CONFIG}}\"

    - name: Run tests
      run: .\test\renderer_test\build\${{env.PLATFORM_DIR}}\${{matrix.CONFIG}}\renderer_test.exe
