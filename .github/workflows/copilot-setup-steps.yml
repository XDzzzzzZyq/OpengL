name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: windows-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission.
      # If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
    - uses: actions/checkout@v4
      name: Checkout
      with:   
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install Mesa
      shell: cmd
      run: |
        curl.exe -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/25.3.5/mesa3d-25.3.5-release-msvc.7z
        curl.exe -L --output mesa.7z.sha256 --url https://github.com/pal1000/mesa-dist-win/releases/download/25.3.5/mesa3d-25.3.5-release-msvc.7z.sha256
        certutil -hashfile mesa.7z SHA256 | findstr /v "hash" | findstr /v "CertUtil" > computed.sha256
        for /f "tokens=1" %%a in (mesa.7z.sha256) do set EXPECTED=%%a
        for /f %%b in (computed.sha256) do set COMPUTED=%%b
        if /i not "%EXPECTED%"=="%COMPUTED%" (echo SHA256 mismatch & exit /b 1)
        mkdir mesa
        "C:\Program Files\7-Zip\7z.exe" x mesa.7z -r -omesa
        cd mesa
        .\systemwidedeploy.cmd 1
